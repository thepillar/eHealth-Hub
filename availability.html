<!DOCTYPE html>
<html>

<head>

    <title>Doctor Availability - eHealth Hub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="dashboard">

        <div class="sidebar">

            <h1>eHealth Hub</h1>

            <ul>

                <li><a href="doctor-dashboard.html">Dashboard</a></li>

                <li><a href="doctor-appointments.html">My Appointments</a></li>

                <li><a href="patient-reports.html">Patient Reports</a></li>

                <li><a href="availability.html">Availability</a></li>

                <li><a href="homepage.html">Logout</a></li>

            </ul>

        </div>

        <div class="content">

            <div class="top">

                <h1>Doctor Availability</h1>

                <p>Update doctor schedules and available working hours.</p>

            </div>

            <div class="table-section">

                <h2>Availability Schedule</h2>

                <form>

                    <label>Select Day</label>
                    <select>
                        <option>Monday</option>
                        <option>Tuesday</option>
                        <option>Wednesday</option>
                        <option>Thursday</option>
                        <option>Friday</option>
                    </select>

                    <label>Available Time</label>
                    <input type="text" placeholder="8:00 AM - 5:00 PM">

                    <label>Status</label>
                    <select>
                        <option>Available</option>
                        <option>Busy</option>
                    </select>

                    <button type="submit">Update Availability</button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
