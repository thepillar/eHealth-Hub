<!DOCTYPE html>
<html>

<head>

<title>Assign Doctors - eHealth Hub</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="dashboard">


<div class="sidebar">


<h1>
eHealth Hub
</h1>


<ul>

<li>
<a href="admin-dashboard.html">
Dashboard

<li>
<a href="manage-patients.html">

<li>

</div>








<div class="content">



<div class="top">

<h1>
Assign Doctors
</h1>


<p>
Assign doctors to pending patient appointments.
</p>


</div>









<!-- ASSIGNMENT FORM -->


<div class="table-section">


<h2>
Assignment Form
</h2>


<form id="assignForm">



<label>
Select Appointment
</label>


<select id="appointmentSelect" required>

<option>
Select appointment
</option>

</select>






<label>
Select Doctor
</label>


<select id="doctorSelect" required>

<option>
Select doctor
</option>

</select>






<button type="submit">
Assign Doctor
</button>



</form>



</div>









<!-- TABLE -->


<div class="table-section">


<h2>
Pending Assignments
</h2>



<table>


<thead>


<tr>

<th>
Patient
</th>

<th>
Department
</th>

<th>
Date
</th>

<th>
Doctor
</th>

<th>
Status
</th>


</tr>


</thead>




<tbody id="assignmentTable">


</tbody>



</table>



</div>







</div>


</div>









<script>



// CHECK ADMIN LOGIN


let currentUser =
JSON.parse(localStorage.getItem("currentUser"));



if(!currentUser || currentUser.role !== "Admin"){


alert("Please login as administrator first.");


window.location.href="../index.html";


}











// LOAD DATA


function loadData(){



let appointments =
JSON.parse(localStorage.getItem("appointments")) || [];



let users =
JSON.parse(localStorage.getItem("users")) || [];






let doctors =
users.filter(function(user){


return user.role==="Doctor";


});





let appointmentSelect =
document.getElementById("appointmentSelect");



appointmentSelect.innerHTML =
"<option>Select appointment</option>";






appointments.forEach(function(app,index){



if(app.status==="Pending"){



let option =
document.createElement("option");


option.value=index;


option.innerHTML =
app.patientName +
" - " +
app.department +
" (" +
app.date +
")";



appointmentSelect.appendChild(option);



}



});








let doctorSelect =
document.getElementById("doctorSelect");



doctorSelect.innerHTML =
"<option>Select doctor</option>";







doctors.forEach(function(doctor,index){



let option =
document.createElement("option");



option.value =
doctor.email;



option.innerHTML =
doctor.fullName +
" - " +
(doctor.department || "General");



doctorSelect.appendChild(option);



});





displayAssignments();



}









// DISPLAY TABLE


function displayAssignments(){



let appointments =
JSON.parse(localStorage.getItem("appointments")) || [];




let table =
document.getElementById("assignmentTable");



table.innerHTML="";








appointments.forEach(function(app){



let row =
document.createElement("tr");




row.innerHTML = `


<td>
${app.patientName}
</td>


<td>
${app.department}
</td>


<td>
${app.date}
</td>


<td>
${app.doctor || "Not Assigned"}
</td>


<td>
${app.status}
</td>


`;



table.appendChild(row);



});



}









// ASSIGN DOCTOR


document.getElementById("assignForm")
.addEventListener("submit",function(event){



event.preventDefault();





let appointments =
JSON.parse(localStorage.getItem("appointments")) || [];





let users =
JSON.parse(localStorage.getItem("users")) || [];







let appointmentIndex =
document.getElementById("appointmentSelect").value;





let doctorEmail =
document.getElementById("doctorSelect").value;







if(appointmentIndex==="Select appointment"){


alert("Select an appointment first.");

return;


}






let doctor =
users.find(function(user){


return user.email===doctorEmail;


});








appointments[appointmentIndex].doctor =
doctor.fullName;



appointments[appointmentIndex].doctorEmail =
doctor.email;



appointments[appointmentIndex].status =
"Assigned";







localStorage.setItem(
"appointments",
JSON.stringify(appointments)
);






alert(
"Doctor assigned successfully."
);






document.getElementById("assignForm").reset();




loadData();



});









loadData();









// LOGOUT


document.getElementById("logout")
.addEventListener("click",function(){


localStorage.removeItem("currentUser");


});



</script>


</body>

</html>s
